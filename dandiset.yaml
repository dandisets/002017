dateCreated: '2026-09-29T05:48:41.851478+00:00'
description: This dataset examines how presynaptic bouton number from individual adult
  DL1 projection neurons scales with Kenyon cell number in the Drosophila mushroom
  body. Kenyon cell populations were experimentally reduced by hydroxyurea ablation
  of mushroom body neuroblasts during development. Single adult DL1 projection neurons
  were generated using tsMARCM, with heat shock at 18.5–21 hours after larval hatching.
  Images acquired with confocal microscopy from sham control and hydroxyurea-treated
  animals.
